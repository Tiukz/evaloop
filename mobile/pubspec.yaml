name: evaloop_mobile
description: "Fondasi aplikasi Android Evaloop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-400.ttf
          weight: 400
        - asset: assets/fonts/inter-500.ttf
          weight: 500
        - asset: assets/fonts/inter-600.ttf
          weight: 600
    - family: Geist
      fonts:
        - asset: assets/fonts/geist-600.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-600.ttf
          weight: 600
